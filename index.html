      a: 1, why: "Gently shows care and love for the home. Slam has an angry connotation. One word choice changes the whole attitude." },
    { s: "s4", poem: "p5", q: "Line 1 says, \"The boxes stand like strangers in the hall.\" Why does the poet compare the boxes to strangers?",
      c: ["To show that the home already feels unfamiliar to the speaker", "To show that the boxes are very tall", "To show that new neighbors have arrived", "To show that the speaker is afraid of the movers"],
      a: 0, why: "Strangers are people you don't know. Things that once belonged in the speaker's room now feel unfamiliar, so the home already feels less like home." },

    // Station 1 add-on: villanelle (kept at the end of the list so saved answers stay matched)
    { s: "s1", poem: "p6", q: "Read \"Take My Time.\" Which form is this poem?",
      c: ["A sonnet, because it has 14 lines and ends with a couplet", "A ballad, because it tells a long story about a test", "A villanelle, because it has 19 lines in five tercets and a final quatrain, with two lines that repeat as refrains", "A haiku, because each stanza has three lines"],
      a: 2, why: "Count: 19 lines. There are five 3-line stanzas and one 4-line stanza, and lines 1 and 3 keep coming back as refrains. That is a villanelle. Three-line stanzas alone do not make a haiku." },
    { s: "s1", poem: "p6", q: "What is the rhyme scheme of each 3-line stanza in the poem?",
      c: ["AAB", "ABA", "ABB", "ABAB"],
      a: 1, why: "time (A), clear (B), climb (A). Every tercet follows ABA, and the whole poem uses only two rhyme sounds: -ime and -ear." },
    { s: "s1", poem: "p6", q: "The lines \"I read each line and take my time\" and \"The words will help me make the climb\" repeat throughout the poem and appear together at the end. How does this structure add to the poem's meaning?",
      c: ["It shows that the speaker forgot what she already wrote", "It works like a calming reminder the speaker repeats, and joining the two lines at the end shows she feels confident and ready", "It shows that the speaker is bored and wants the test to be over", "It shows that the test has the same question over and over"],
      a: 1, why: "In a villanelle, the refrains carry the big idea. The speaker repeats her test strategy like a pep talk, and putting both refrains together in the last stanza makes a final, confident promise." }
  ]
};
if (typeof module !== "undefined") module.exports = REVIEW;

</script>
<script>
(function(){
const R=REVIEW, L=["A","B","C","D"]; R.questions.forEach((q,i)=>q.i=i);
const ORDER=[]; R.stations.forEach(s=>R.questions.forEach(q=>{if(q.s===s.id)ORDER.push(q)})); ORDER.forEach((q,n)=>q.n=n+1);
const app=document.getElementById("app");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const st=id=>R.stations.find(s=>s.id===id);
const KEY="reesPM2FollowAlong_v1";
let S={ans:{},checked:{},view:"home",n:null,party:false};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}"));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const right=()=>ORDER.filter(q=>S.ans[q.n]===q.a&&S.checked[q.n]).length;
const answered=()=>Object.keys(S.ans).length;
function setScore(){document.getElementById("score").textContent=`⭐ ${right()} · ${answered()}/${ORDER.length} answered`;}
function go(view,n){S.view=view;if(n!==undefined)S.n=n;save();render();scrollTo({top:0,behavior:"smooth"});}

function render(){setScore(); if(S.view==="q") return qView(); if(S.view==="results") return results(); home();}

function home(){
  app.innerHTML=`<div class="tip"><span>👀</span><div>Watch the board and listen. When Mrs. Rees shows a question, tap that number below.</div></div>
  ${R.stations.map((s,si)=>`<div class="st">${s.icon} Station ${si+1}: ${esc(s.name)}</div><div class="grid">
    ${ORDER.filter(q=>q.s===s.id).map(q=>{const a=S.ans[q.n]; let mark=""; if(a!==undefined) mark=S.checked[q.n]?(a===q.a?"✅":"❌"):"🔒";
      return `<button class="qb ${a!==undefined?"done":""}" style="background:${s.color}" data-n="${q.n}">${q.n}<small>${mark||"tap"}</small></button>`;}).join("")}
  </div>`).join("")}
  <div class="row" style="justify-content:center;margin-top:20px"><button class="btn" id="res">📊 My results</button></div>`;
  app.querySelectorAll(".qb").forEach(b=>b.onclick=()=>go("q",+b.dataset.n));
  document.getElementById("res").onclick=()=>go("results");
}

function poemHTML(pid){const p=R.poems[pid];let n=0;return `<details class="poem"><summary>📜 Show the poem: ${esc(p.title)}</summary><ol>${p.lines.map(l=>l===""?'<li class="gap"></li>':`<li><span class="n">${++n}</span><span>${esc(l)}</span></li>`).join("")}</ol></details>`;}

function qView(){
  const q=ORDER[S.n-1]; if(!q) return go("home");
  const s=st(q.s), mine=S.ans[q.n], chk=!!S.checked[q.n];
  const choices=q.c.map((c,ci)=>{let cls="ch"; if(chk){ if(ci===q.a)cls+=" right"; else if(ci===mine)cls+=" wrong"; } else if(ci===mine) cls+=" mine";
    return `<button class="${cls}" data-ci="${ci}" ${mine!==undefined?"disabled":""}><span class="L">${L[ci]}</span><span>${esc(c)}</span></button>`;}).join("");
  let foot="";
  if(chk){const ok=mine===q.a; foot=`<div class="fb ${ok?"good":"bad"}"><b>${ok?"🎉 You got it!":"💡 Not quite. The answer is "+L[q.a]+"."}</b>${esc(q.why)}</div>`;}
  else if(mine!==undefined){foot=`<div class="lock">🔒 Answer locked in! Eyes on the board.<br>When Mrs. Rees reveals the answer, tap the green button.</div>
    <div class="row" style="justify-content:center"><button class="btn green" id="check">👀 Check my answer</button></div>`;}
  const nextQ=ORDER[q.n];
  app.innerHTML=`<div class="card"><span class="tag" style="background:${s.color}">${s.icon} ${esc(s.name)}</span>
    <div class="qn">Question ${q.n}</div>
    <div class="qtext">${esc(q.q)}</div>${choices}${foot}${q.poem?poemHTML(q.poem):""}
    <div class="row"><button class="btn ghost" id="back">🔢 All questions</button>${nextQ?`<button class="btn ghost" id="nx">Question ${nextQ.n} ➜</button>`:`<button class="btn" id="res">📊 My results</button>`}</div></div>`;
  app.querySelectorAll(".ch:not([disabled])").forEach(b=>b.onclick=()=>{
    const ci=+b.dataset.ci;
    if(!confirm("Lock in "+L[ci]+"? You only get one try.")) return;
    S.ans[q.n]=ci; save(); render();
  });
  const ck=document.getElementById("check"); if(ck) ck.onclick=()=>{S.checked[q.n]=1;save();render();if(S.ans[q.n]===q.a)burst();};
  document.getElementById("back").onclick=()=>go("home");
  const nx=document.getElementById("nx"); if(nx) nx.onclick=()=>go("q",nextQ.n);
  const rs=document.getElementById("res"); if(rs) rs.onclick=()=>go("results");
}

function results(){
  // checking reveals results for any answered question
  Object.keys(S.ans).forEach(n=>S.checked[n]=1); save(); setScore();
  const r=right(), a=answered(), pct=a?Math.round(r/ORDER.length*100):0;
  const missed=ORDER.filter(q=>S.ans[q.n]!==undefined&&S.ans[q.n]!==q.a);
  const skipped=ORDER.filter(q=>S.ans[q.n]===undefined);
  app.innerHTML=`<div class="card center"><div class="big">🏆🔑</div><h2 style="font-size:30px">My PM 2 Poetry Results</h2>
    <div class="pts">${r} / ${ORDER.length}</div>
    <p style="font-weight:800;font-size:20px">${pct>=85?"You are PM 2 ready! 🌟":pct>=70?"Almost there! Review what you missed. 💪":"Keep practicing. Review the key ideas! 📚"}</p>
    <div>${R.stations.map((s,si)=>{const qs=ORDER.filter(q=>q.s===s.id);return `<span class="pill" style="background:${s.color}">${s.icon} Station ${si+1}: ${qs.filter(q=>S.ans[q.n]===q.a).length}/${qs.length}</span>`;}).join("")}</div>
    ${missed.length?`<p style="font-weight:800;margin-bottom:4px">Review: ${missed.map(q=>"Q"+q.n).join(", ")}</p>`:""}
    ${skipped.length?`<p style="font-weight:700;color:var(--muted);margin-top:4px">Not answered: ${skipped.map(q=>"Q"+q.n).join(", ")}</p>`:""}
    <p style="font-weight:800">📸 Take a screenshot of this screen and turn it in on Canvas.</p>
    <div class="row" style="justify-content:center"><button class="btn ghost" id="back">🔢 All questions</button><button class="btn" id="party">🎉 Celebrate</button></div></div>`;
  document.getElementById("back").onclick=()=>go("home");
  document.getElementById("party").onclick=()=>rain(3000);
  rain(3500);
}

document.getElementById("reset").onclick=()=>{if(confirm("Erase all your answers and start over?")){S={ans:{},checked:{},view:"home",n:null};save();render();}};

// confetti
const cv=document.getElementById("confetti"),cx=cv.getContext("2d");let P=[],raf=null;const D=devicePixelRatio||1;
function sz(){cv.width=innerWidth*D;cv.height=innerHeight*D;}addEventListener("resize",sz);sz();
const C=["#7c3aed","#db2777","#0891b2","#ea580c","#f59e0b","#16a34a"];
function sp(n,x,y,s){for(let i=0;i<n;i++)P.push({x:x*D,y:y*D,vx:(Math.random()-.5)*s*D,vy:(-Math.random()*s-3)*D*.8,z:(7+Math.random()*8)*D,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:C[i%C.length],t:0});if(!raf)lp();}
function lp(){cx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.25*D;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.t++;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.z/2,-p.z/4,p.z,p.z/2);cx.restore();});P=P.filter(p=>p.y<cv.height+40&&p.t<400);raf=P.length?requestAnimationFrame(lp):(cx.clearRect(0,0,cv.width,cv.height),null);}
function burst(){sp(50,innerWidth/2,innerHeight*.5,16);}
function rain(ms){const end=Date.now()+ms;(function f(){sp(14,Math.random()*innerWidth,-10,6);if(Date.now()<end)setTimeout(f,170);})();}

render();
})();
</script>
</body>
